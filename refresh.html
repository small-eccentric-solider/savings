<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>更新 Savings</title><style>body{margin:0;min-height:100dvh;display:grid;place-content:center;text-align:center;background:#f4f6f8;color:#192d37;font-family:system-ui,-apple-system,'PingFang SC',sans-serif;padding:24px}h1{font-size:23px}p,a{font-size:14px;color:#078e76;line-height:1.8}</style></head><body><h1>正在更新 Savings…</h1><p id="status">更新完成后将自动打开看板</p><a href="./" id="continue">打开看板</a><script>
(async()=>{
  try{
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('budget-pwa-static-')).map(k=>caches.delete(k)));}
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
      await reg.update();
      const worker=reg.installing||reg.waiting;
      if(worker&&worker.state!=='activated')await new Promise(resolve=>{const timer=setTimeout(resolve,8000);worker.addEventListener('statechange',()=>{if(worker.state==='activated'||worker.state==='redundant'){clearTimeout(timer);resolve();}});});
    }
    location.replace('./?updated='+Date.now());
  }catch(e){document.getElementById('status').textContent='请联网后点下方“打开看板”重试。';}
})();
</script></body></html>
