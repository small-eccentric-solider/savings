<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="训练">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>胸肩背 · 跟练</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1115;color:#f2f2f2;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:520px;padding:20px;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;justify-content:space-between;font-size:14px;color:#9aa0aa;margin-bottom:8px}
.bar{height:8px;background:#232733;border-radius:4px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#22d3ee);width:0;transition:width .3s}
.card{flex:1;background:#181b23;border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center}
.phase{font-size:14px;letter-spacing:2px;padding:4px 12px;border-radius:99px;background:#232733;color:#9aa0aa;margin-bottom:16px}
.phase.work{background:#064e3b;color:#6ee7b7}.phase.rest{background:#1e3a8a;color:#93c5fd}.phase.warm{background:#78350f;color:#fcd34d}
h1{font-size:34px;margin-bottom:10px}
.target{font-size:22px;color:#e5e7eb;margin-bottom:8px}
.tip{font-size:15px;color:#9aa0aa;line-height:1.6;max-width:380px}
.timer{font-size:88px;font-weight:700;font-variant-numeric:tabular-nums;margin:18px 0 6px}
.rest .timer{color:#93c5fd}
.next{margin-top:18px;font-size:14px;color:#6b7280}
.btn{margin-top:22px;width:100%;padding:22px;font-size:22px;font-weight:700;border:none;border-radius:16px;background:#34d399;color:#062016;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.blue{background:#60a5fa;color:#071a33}
.row{display:flex;gap:10px;margin-top:10px}
.small{flex:1;padding:12px;font-size:15px;border:none;border-radius:12px;background:#232733;color:#cbd5e1;cursor:pointer}
.hidden{display:none}
select{width:100%;padding:12px;background:#181b23;color:#f2f2f2;border:1px solid #343a48;border-radius:12px;font:inherit;margin-bottom:16px}button:focus-visible,select:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}.tip{white-space:pre-line}.small:disabled{opacity:.35;cursor:default}.foot{font-size:12px;color:#6b7280;text-align:center;margin-top:14px;line-height:1.6}@media(max-height:740px){.wrap{padding:16px}.card{padding:20px 16px}.timer{font-size:70px;margin:12px 0}.btn{padding:17px;margin-top:16px}h1{font-size:28px}}
.wrap{min-height:100dvh;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}body{min-height:100dvh}button,select{touch-action:manipulation}
.pose{width:100%;margin:14px 0 10px;cursor:zoom-in}.pose-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pose-grid.single{grid-template-columns:1fr}.pose figure{margin:0;background:#fff;border-radius:10px;overflow:hidden}.pose img{display:block;width:100%;height:140px;object-fit:contain;background:#fff}.pose .single img{height:190px}.pose figcaption{font-size:12px;color:#475569;background:#edf2f7;padding:5px}.pose-hint{font-size:11px;color:#9aa0aa;margin-top:5px}.source{font-size:10px;color:#6b7280;text-decoration:none}dialog{background:#181b23;color:#f2f2f2;border:1px solid #343a48;border-radius:18px;width:min(94vw,720px);max-height:90dvh;margin:auto;padding:16px;overflow:auto}dialog::backdrop{background:#000b}.close-pose{position:sticky;top:0;display:block;margin:0 0 12px auto;padding:10px 20px;border:0;border-radius:10px;background:#34d399;color:#062016;font-weight:700;cursor:pointer}.pose-large img{display:block;width:100%;height:auto;background:#fff;border-radius:10px}.pose-large p{font-size:14px;margin:10px 0 6px}.card:has(.pose:not(.hidden)){justify-content:flex-start;padding:20px 16px}.card:has(.pose:not(.hidden)) .phase{margin-bottom:10px}.card:has(.pose:not(.hidden)) h1{font-size:28px}.card:has(.pose:not(.hidden)) .target{font-size:20px}.card:has(.pose:not(.hidden)) .next{margin-top:12px}@media(max-height:740px){.pose img{height:115px}.pose .single img{height:145px}.pose{margin:10px 0}.card:has(.pose:not(.hidden)){padding:16px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <select id="day" aria-label="选择训练日"></select><div class="top"><span id="stepNo"></span><span id="total">约 30 分钟 · 含组间休息</span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card">
    <div class="phase" id="phase">准备</div>
    <h1 id="name">今天练胸</h1>
    <div class="target" id="target">每个动作 3 组</div>
    <div class="pose hidden" id="pose" role="button" tabindex="0" aria-label="放大动作参考图"><div class="pose-grid" id="poseGrid"></div><p class="pose-hint">点击图片放大 · 器械外观可能不同</p></div>
    <div class="tip" id="tip">做完一组点一下，自动休息 90 秒。</div>
    <div class="timer hidden" id="timer">0</div>
    <div class="next" id="next"></div>
  </div>
  <button class="btn" id="main">开始训练</button>
  <div class="row">
    <button class="small" id="back">上一步</button>
    <button class="small" id="pause">暂停</button>
    <button class="small" id="reset">重新开始</button>
  </div>
  <p class="foot">动作做稳，不赶时间。出现疼痛或头晕就停下。<br>保持页面打开；切到后台会暂停计时。<br><a class="source" href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">动作图片：Free Exercise DB</a></p>
</div>
<dialog id="poseDialog" aria-label="动作参考大图"><button class="close-pose" id="closePose">关闭大图</button><div class="pose-large" id="poseLarge"></div></dialog>
<script>
const poseImages={"器械推胸": ["./images/Machine_Bench_Press-0.webp", "./images/Machine_Bench_Press-1.webp"], "上斜器械推胸": ["./images/Leverage_Incline_Chest_Press-0.webp", "./images/Leverage_Incline_Chest_Press-1.webp"], "蝴蝶机夹胸": ["./images/Butterfly-0.webp", "./images/Butterfly-1.webp"], "绳索三头下压": ["./images/Triceps_Pushdown_-_Rope_Attachment-0.webp", "./images/Triceps_Pushdown_-_Rope_Attachment-1.webp"], "器械肩推": ["./images/Leverage_Shoulder_Press-0.webp", "./images/Leverage_Shoulder_Press-1.webp"], "哑铃侧平举": ["./images/Side_Lateral_Raise-0.webp", "./images/Side_Lateral_Raise-1.webp"], "反向蝴蝶机": ["./images/Reverse_Machine_Flyes-0.webp", "./images/Reverse_Machine_Flyes-1.webp"], "平板支撑": ["./images/Plank-0.webp"], "高位下拉": ["./images/Wide-Grip_Lat_Pulldown-0.webp", "./images/Wide-Grip_Lat_Pulldown-1.webp"], "胸托坐姿划船": ["./images/Leverage_Iso_Row-0.webp", "./images/Leverage_Iso_Row-1.webp"], "绳索直臂下压": ["./images/Straight-Arm_Pulldown-0.webp", "./images/Straight-Arm_Pulldown-1.webp"], "哑铃弯举": ["./images/Dumbbell_Bicep_Curl-0.webp", "./images/Dumbbell_Bicep_Curl-1.webp"]};
const plans=[
{label:'周一 · 胸',name:'今天练胸',moves:[['器械推胸','10 次','背贴靠垫，肩膀放松，慢推慢放。'],['上斜器械推胸','10 次','把手对准上胸，不耸肩、不拱腰。'],['蝴蝶机夹胸','12 次','手肘微屈，夹拢后慢慢打开，不往后拉太深。'],['绳索三头下压','12 次','肘部贴近身体，伸肘下压，不前后甩动。']]},
{label:'周二 · 单车',name:'今天骑单车',type:'bike'},
{label:'周三 · 肩',name:'今天练肩',moves:[['器械肩推','10 次','背贴靠垫，向上推，不挺腰、不锁死手肘。'],['哑铃侧平举','12 次','用轻重量，抬到肩高以内，不耸肩、不甩动。'],['反向蝴蝶机','12 次','胸贴靠垫，向两侧打开，缓慢回放。'],['平板支撑','20–30 秒','收紧腹部、正常呼吸，塌腰就结束；自己数秒，结束后点完成。']]},
{label:'周四 · 快走',name:'今天快走恢复',type:'walk'},
{label:'周五 · 背',name:'今天练背',moves:[['高位下拉','10 次','拉向上胸，不拉到脖子后面，不后仰甩动。'],['胸托坐姿划船','10 次','胸贴靠垫，拉向上腹，慢慢回放。'],['绳索直臂下压','12 次','肘部保持微屈，压向大腿前方，不弯腰甩动。'],['哑铃弯举','12 次','肘部贴近身体，缓慢抬起、放下，不后仰。']]},
{label:'周六 · 单车',name:'今天骑单车',type:'bike'},
{label:'周日 · 快走',name:'今天快走恢复',type:'walk'}];
const $=id=>document.getElementById(id);
const today=({Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6})[new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',weekday:'short'}).format(new Date())];
$('day').innerHTML=plans.map((p,j)=>`<option value="${j}">${p.label}${j===today?'（今天）':''}</option>`).join('');$('day').value=today;
let day=today,S=[],i=-1,left=0,interval=null,paused=false,deadline=0,ac=null,wake=null,remaining=0;
const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
function beep(){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3);}catch(e){}}
function stop(){clearInterval(interval);interval=null;}
function setTimer(){deadline=Date.now()+left*1000;interval=setInterval(()=>{if(paused)return;left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=fmt(left);if(left===0){stop();beep();go();}},200);}
function make(){const p=plans[day];S=[];if(p.moves){
S.push({t:'warm',name:'跑步机快走',sec:180,tip:'平路快走，呼吸稍微加深；最后减速，停稳再下机。'});
S.push({t:'warm',name:p.moves[0][0]+' · 热身',sec:60,tip:'用很轻的重量做 6 次，剩余时间休息。'});
p.moves.forEach((m,j)=>{for(let set=1;set<=3;set++){S.push({t:'work',name:m[0],target:`第 ${set}/3 组 · ${m[1]}`,tip:m[2]});if(set<3)S.push({t:'rest',name:'组间休息',sec:90,tip:'放松呼吸，下一组还是这个动作。'});}if(j<p.moves.length-1)S.push({t:'rest',name:'换下一个动作',sec:60,tip:'调好器械，负重动作先用轻重量试 5 次；来不及就暂停。'});});
S.push({t:'warm',name:'慢走放松',sec:120,tip:'慢慢走，恢复呼吸。',cool:true});
}else{const bike=p.type==='bike';S.push({t:'warm',name:bike?'单车热身':'轻松走起来',sec:180,tip:bike?'低阻力，轻松踩。':'先慢慢走，不着急。'});for(let j=0;j<4;j++)S.push({t:'aerobic',name:bike?'稳定骑行':'舒适快走',sec:360,target:`第 ${j+1}/4 段`,tip:'呼吸加深，但还能说完整句话。今天不冲刺。'});S.push({t:'warm',name:bike?'单车放松':'慢走放松',sec:180,tip:'逐渐放慢，恢复呼吸。',cool:true});}}
function intro(){hidePose();stop();paused=false;i=-1;left=0;release();make();$('day').disabled=false;$('stepNo').textContent=plans[day].label;$('prog').style.width='0%';$('phase').className='phase';$('phase').textContent='准备';$('card').className='card';$('name').textContent=plans[day].name;$('target').textContent=plans[day].moves?'每个动作 3 组':'30 分钟，跟着计时走';$('tip').textContent=plans[day].moves?plans[day].moves.map((m,j)=>`${j+1}. ${m[0]} · ${m[1]}`).join('\n'):'热身 3 分钟 → 主训练 24 分钟 → 放松 3 分钟';$('timer').classList.add('hidden');$('next').textContent=plans[day].moves?'做完一组点一下 → 自动休息 90 秒':'今天不做力量训练';$('main').textContent='开始训练';$('main').className='btn';$('main').onclick=start;$('pause').textContent='暂停';$('pause').disabled=true;$('back').disabled=true;}
function show(){stop();paused=false;const s=S[i];if(!s){done();return;}$('pause').textContent='暂停';$('pause').disabled=!s.sec;$('back').disabled=i<=0;$('day').disabled=true;$('stepNo').textContent=`第 ${i+1} / ${S.length} 步`;$('prog').style.width=(i/S.length*100)+'%';$('card').className='card '+(s.t==='rest'?'rest':'');$('phase').className='phase '+s.t;$('phase').textContent=s.t==='work'?'训练':s.t==='rest'?'休息':s.t==='aerobic'?'有氧':s.cool?'放松':'热身';$('name').textContent=s.name;showPose(s.t==='work'?s.name:null);$('target').textContent=s.target||'';$('tip').textContent=s.tip;const next=S[i+1];$('next').textContent=next?'下一步：'+next.name+(next.target?' · '+next.target:''):'最后一步';$('main').className='btn'+(s.sec?' blue':'');$('main').textContent=s.t==='rest'?'休息好了，继续':s.sec?'下一步':'✓ 完成这组';$('main').onclick=go;if(s.sec){left=s.sec;$('timer').classList.remove('hidden');$('timer').textContent=fmt(left);setTimer();}else{$('timer').classList.add('hidden');}}
function go(){i++;show();}
async function lock(){try{wake=await navigator.wakeLock?.request('screen');}catch(e){}}
function release(){if(wake)wake.release().catch(()=>{});wake=null;}
function start(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}lock();go();}
function pause(){if(!S[i]?.sec||i>=S.length||i<0)return;if(paused){paused=false;deadline=Date.now()+left*1000;lock();}else{left=Math.max(0,Math.ceil((deadline-Date.now())/1000));paused=true;release();}$('pause').textContent=paused?'继续':'暂停';$('main').disabled=paused;}
function done(){hidePose();stop();release();$('day').disabled=false;$('prog').style.width='100%';$('stepNo').textContent='完成';$('phase').className='phase work';$('phase').textContent='完成';$('name').textContent='今天练完了！';$('target').textContent='';$('tip').textContent='喝点水，好好休息。';$('timer').classList.add('hidden');$('next').textContent='';$('main').textContent='回到计划';$('main').className='btn';$('main').onclick=intro;$('pause').disabled=true;$('back').disabled=true;}
function hidePose(){$('pose').classList.add('hidden');$('poseGrid').innerHTML='';$('poseLarge').innerHTML='';if($('poseDialog').open)$('poseDialog').close();}
function showPose(name){const images=poseImages[name];if(!images){hidePose();return;}$('pose').classList.remove('hidden');$('poseGrid').className='pose-grid'+(images.length===1?' single':'');$('poseGrid').innerHTML=images.map((src,k)=>`<figure><img src="${src}" alt="${name}：${images.length===1?'保持姿势':k===0?'起始姿势':'发力后的姿势'}" decoding="async"><figcaption>${images.length===1?'保持姿势':k===0?'① 起始':'② 发力'}</figcaption></figure>`).join('');$('poseLarge').innerHTML=images.map((src,k)=>`<p>${name} · ${images.length===1?'保持姿势':k===0?'① 起始':'② 发力'}</p><img src="${src}" alt="${name}动作参考">`).join('');}
$('pose').onclick=()=>{if(!$('pose').classList.contains('hidden'))$('poseDialog').showModal();};$('pose').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('pose').click();}};$('closePose').onclick=()=>$('poseDialog').close();
$('pause').onclick=pause;$('back').onclick=()=>{if(i>0){$('main').disabled=false;i--;show();}};$('reset').onclick=()=>{$('main').disabled=false;intro();};$('day').onchange=()=>{day=Number($('day').value);intro();};document.addEventListener('visibilitychange',()=>{if(document.hidden&&interval&&!paused)pause();});intro();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(()=>{}));}</script>
</body></html>
